name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] \
             && [ -z "${{ github.event.release.tag_name }}" ] \
             && [ -z "${{ github.event.inputs.tag }}" ]; then
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          COMMIT="${GITHUB_SHA:0:7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w \
              -X github.com/its0din-ai/tldr/internal/buildinfo.Version=${VERSION} \
              -X github.com/its0din-ai/tldr/internal/buildinfo.Commit=${COMMIT} \
              -X github.com/its0din-ai/tldr/internal/buildinfo.Date=${DATE}" \
            -o "dist/tldr-linux-${{ matrix.arch }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tldr-linux-${{ matrix.arch }}
          path: dist/tldr-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: release
    if: |
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tldr-linux-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum tldr-linux-* > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          files: |
            dist/tldr-linux-amd64
            dist/tldr-linux-arm64
            dist/SHA256SUMS.txt
          generate_release_notes: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
